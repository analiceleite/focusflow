<div class="auth-page">
    <!-- Theme Toggle moved into navbar; removed duplicate -->
    <div class="auth-card">
        <div class="logo">
            <span class="logo-icon">⏰</span>
            <h1>FocusFlow</h1>
            <p>Seu tempo, seu foco.</p>
        </div>

        <div class="tabs">
            <button [class.active]="!isRegister()" (click)="isRegister.set(false); error.set(''); successMessage.set('');">
                Entrar
            </button>
            <button [class.active]="isRegister()" (click)="isRegister.set(true); error.set(''); successMessage.set('');">
                Criar conta
            </button>
        </div>

        <form (ngSubmit)="submit()">
            <div class="field">
                <label>E-mail</label>
                <input type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" required />
            </div>

            <div class="field">
                <label>Senha</label>
                <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
                @if (!isRegister()) {
                <div class="forgot-password-row">
                    <button type="button" class="btn-forgot" (click)="recoverPassword()" [disabled]="loading()">
                        Esqueci minha senha
                    </button>
                </div>
                }
            </div>

            @if (error()) {
            <div class="error-msg">{{ error() }}</div>
            }

            @if (successMessage()) {
            <div class="success-msg">{{ successMessage() }}</div>
            }

            <button type="submit" class="btn-submit" [disabled]="loading()">
                {{ loading() ? 'Aguarde...' : (isRegister() ? 'Criar conta' : 'Entrar') }}
            </button>
        </form>
    </div>
</div>
