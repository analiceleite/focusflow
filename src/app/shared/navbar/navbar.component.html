<nav class="sidebar" aria-label="Navegação principal">
    <a routerLink="/timer" class="sidebar-brand" aria-label="FocusFlow, início">
        <img class="sidebar-logo-img" src="assets/icons/focusflow-mark.svg" alt="" aria-hidden="true" />
        <span class="sidebar-logo-text">FocusFlow</span>
    </a>

    <div class="nav-main">
        <a routerLink="/timer" routerLinkActive="active" class="nav-item nav-route" title="Foco">
            <span class="nav-icon"><app-icon name="focus" [size]="18"></app-icon></span>
            <span class="nav-label">Foco</span>
        </a>
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item nav-route" title="Jornada do herói">
            <span class="nav-icon"><app-icon name="sword" [size]="18"></app-icon></span>
            <span class="nav-label">Jornada</span>
        </a>
    </div>

    <div class="nav-actions">
        <app-theme-toggle></app-theme-toggle>
        <button class="nav-item nav-logout" (click)="logout()" title="Sair" aria-label="Sair">
            <span class="nav-icon"><app-icon name="logout" [size]="18"></app-icon></span>
        </button>
    </div>
</nav>
